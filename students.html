{% extends 'base.html' %}{% block body %}<h4>Students</h4>
<div class="card p-3 mb-3"><form method="post" class="row g-2">
<div class="col-6 col-md-2"><input name="username" class="form-control" placeholder="Student ID" required></div>
<div class="col-6 col-md-3"><input name="name" class="form-control" placeholder="Name" required></div>
<div class="col-4 col-md-1"><input name="block" class="form-control" placeholder="Block"></div>
<div class="col-4 col-md-2"><input name="room" class="form-control" placeholder="Room"></div>
<div class="col-4 col-md-2"><input name="password" type="password" class="form-control" placeholder="Password" required></div>
<div class="col-12 col-md-2"><button class="btn btn-primary w-100">Add Student</button></div></form></div>
<form class="mb-3"><input name="q" value="{{q}}" class="form-control" placeholder="Search name / ID, press Enter"></form>
<div class="card p-3 table-responsive"><table class="table"><tr><th>ID</th><th>Name</th><th>Block</th><th>Room</th><th></th></tr>
{% for s in students %}<tr><td>{{s.username}}</td><td>{{s.name}}</td><td>{{s.block}}</td><td>{{s.room}}</td>
<td class="d-flex gap-1"><a class="btn btn-sm btn-outline-primary" href="/admin/students/edit/{{s.id}}">Edit</a><form method="post" action="/admin/students/delete/{{s.id}}" onsubmit="return confirm('Delete?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
